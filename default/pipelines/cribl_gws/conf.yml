output: default
streamtags: []
groups:
  SbRroP:
    name: Initial Parsing and Timestamping
    description: >-
      Parses the JSON object so that we can start working with the fields,
      sets _time to the correct value
    index: 3
  SDNEgH:
    name: (Optional) Reduction Pipeline
    description: >-
      Pass the events through the reduction pipelines to handle event
      reductions.
    index: 4
    disabled: true
  BRnjBm:
    name: Outputs
    description: >-
      Select the output required, if nothing enabled standard JSON will be
      sent
    index: 5
asyncFuncTimeout: 1000
functions:
  - id: comment
    filter: 'true'
    conf:
      comment: >-
        This conditioning pipeline is for use on the Google Workspace Rest
        Events API endpoint. The Pack will normalize the JSON data from the
        collector and provide optional reduction techniques. 


        There are two current available output formats for the data: 
            1. Standard JSON that is formatted and timestamp normalized. 
            3. Splunk; The index value can be modified within the pipeline, however the default value is set in Knowledge > Variables. The sourcetype is set on each collector. Note: changing the sourcetype can affect how the data is handled by Splunk.
  - id: comment
    filter: 'true'
    conf:
      comment: 'For additional details, see this pack''s README under Settings.'
  - filter: 'true'
    conf:
      comment: 'Author: Cribl Packs Team'
    id: comment
  - filter: 'true'
    conf:
      mode: extract
      type: json
      srcField: _raw
      fieldFilterExpr: value !== '' && value !== null
      remove: []
      keep: []
    id: serde
    disabled: false
    description: Parse the JSON from _raw
    groupId: SbRroP
  - filter: 'true'
    conf:
      remove:
        - _raw
    id: eval
    disabled: false
    description: Remove intermediate fields
    groupId: SbRroP
  - filter: 'true'
    conf:
      dbLookup: false
      matchMode: exact
      reloadPeriodSec: -1
      inFields:
        - eventField: 'events[0].name'
          lookupField: action
        - eventField: id.applicationName
          lookupField: event_type
      addToEvent: false
      ignoreCase: false
      outFields:
        - lookupField: event_action
          eventField: __event_action
          defaultValue: keep
      file: gws_events.csv
    id: lookup
    disabled: false
    groupId: SbRroP
    description: Appends the __event_action to the event
  - id: auto_timestamp
    filter: 'true'
    conf:
      srcField: id.time
      dstField: _time
      defaultTimezone: UTC
      timeExpression: time.getTime() / 1000
      offset: 0
      maxLen: 150
      defaultTime: now
      latestDateAllowed: +1week
      earliestDateAllowed: '-420weeks'
    groupId: SbRroP
    disabled: false
  - filter: 'true'
    conf:
      processor: cribl_gws_reductions
    id: chain
    disabled: true
    description: >-
      (Optional) Pass the events through the reduction pipelines to handle
      event reductions.
    groupId: SDNEgH
  - filter: 'true'
    conf:
      comment: Output to Splunk
    id: comment
    disabled: false
    groupId: BRnjBm
  - filter: 'true'
    conf:
      type: json
      dstField: _raw
      fields:
        - '!_*'
        - '!cribl*'
        - '!source'
        - '!host'
        - '!sourcetype'
        - '!index'
        - '*'
    id: serialize
    disabled: false
    groupId: BRnjBm
    description: Serialize JSON to _raw
  - filter: 'true'
    conf:
      add:
        - disabled: false
          value: 'index ? index : C.vars[''default_splunk_index'']'
          name: index
        - disabled: false
          value: |-
            sourcetype=="gws:alerts"
              ? sourcetype
              : ({
                  admin:                     C.vars['splunk_sourcetype_gws_admin'],
                  login:                     C.vars['splunk_sourcetype_gws_login'],
                  token:                     C.vars['splunk_sourcetype_gws_token'],
                  drive:                     C.vars['splunk_sourcetype_gws_drive'],
                  gcp:                       C.vars['splunk_sourcetype_gws_gcp'],
                  rules:                     C.vars['splunk_sourcetype_gws_rules'],
                  devices:                   C.vars['splunk_sourcetype_gws_devices'],
                  chrome:                    C.vars['splunk_sourcetype_gws_chrome'],
                  saml:                      C.vars['splunk_sourcetype_gws_saml'],
                  chat:                      C.vars['splunk_sourcetype_gws_chat'],
                  calendar:                  C.vars['splunk_sourcetype_gws_calendar'],
                  alerts:                    C.vars['splunk_sourcetype_gws_alerts'],
                  gemini_in_workspace_apps:  C.vars['splunk_sourcetype_gws_gemini_in_workspace_apps'],
                  access_transparency:       C.vars['splunk_sourcetype_gws_access_transparency'],
                  context_aware_access:      C.vars['splunk_sourcetype_gws_context_aware_access'],
                  groups_enterprise:         C.vars['splunk_sourcetype_gws_groups_enterprise'],
                  data_studio:               C.vars['splunk_sourcetype_gws_data_studio']
                }[id.applicationName] || C.vars['default_splunk_sourcetype'])
          name: sourcetype
      keep: []
      remove: []
    id: eval
    disabled: false
    groupId: BRnjBm
    description: Sets the index and sourcetype for Splunk output
  - filter: 'true'
    conf:
      add: []
      keep:
        - _*
        - cribl*
        - source
        - host
        - index
        - sourcetype
      remove:
        - '*'
    id: eval
    disabled: false
    description: Sets the index and sourcetype for Splunk output
    groupId: BRnjBm
description: >-
  Pipeline for parsing, formatting and filtering Google Workspace Rest API
  events.
